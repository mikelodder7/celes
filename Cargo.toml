[package]
authors = ["Michael Lodder <redmike7@gmail.com>"]
description = """
Rust crate for handling ISO 3166-1 and optionally ISO 3166-2.
Each country has a three digit code, two letter code, three letter code,
full state name, short English aliases, and optional subdivision data.
"""
documentation = "https://docs.rs/celes/"
categories = ["encoding", "parsing"]
edition = "2024"
homepage = "https://crates.io/crates/celes"
include = [
    "src/*.rs",
    "tools/*.rs",
    "Cargo.toml",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "LICENSE-UNICODE",
    "README.md",
    "tests/*.rs",
]
keywords = ["iso3166", "alpha2", "alpha3", "country", "codes"]
license = "Apache-2.0 OR MIT"
name = "celes"
readme = "README.md"
repository = "https://github.com/mikelodder7/celes"
rust-version = "1.97"
version = "3.0.0-pre2"

[features]
default = ["serde"]
serde = ["dep:serde"]
subdivisions = []

[dependencies]
serde = { version = "1", default-features = false, optional = true }
phf = { version = "0.14", default-features = false, features = ["macros"] }
thiserror = { version = "2", default-features = false }

[dev-dependencies]
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde = { version = "1", default-features = false, features = ["derive"] }
serde_cbor_2 = "0.13"
serde_json = "1.0"
toml = "1"
yaml_serde = "0.10"

[package.metadata.docs.rs]
all-features = true

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
missing_copy_implementations = "warn"
rust_2018_idioms = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused = "warn"

[lints.clippy]
mod_module_files = "warn"
unwrap_used = "deny"
pedantic = { level = "deny", priority = -1 }
needless_pass_by_value = "deny"
cloned_instead_of_copied = "deny"
doc_markdown = "deny"
must_use_candidate = "deny"
return_self_not_must_use = "deny"
semicolon_if_nothing_returned = "deny"
uninlined_format_args = "deny"
